[project]
name = "trenddee-be"
version = "0.1.0"
description = "TrendDee Backend - News analysis & portfolio API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "supabase>=2.10.0",
    "anthropic>=0.40.0",
    "yfinance>=0.2.50",
    "httpx>=0.28.0",
    "feedparser>=6.0.11",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.30.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
